workflows:
  android-build:
    name: Android Build
    max_build_duration: 15
    instance_type: mac_mini_m2
    scripts:
      - name: Inspect Files and Build
        script: |
          echo "=== استعراض المجلدات والملفات داخل المستودع ==="
          ls -la
          echo "==============================================="
          find . -maxdepth 3 -not -path '*/.*'
          echo "==============================================="
          
          # محاولة البحث عن مشاريع Node / React Native
          PACKAGE_JSON=$(find . -name "package.json" -type f | head -n 1)
          if [ -n "$PACKAGE_JSON" ]; then
            echo "تم اكتشاف مشروع JavaScript / React Native في: $(dirname "$PACKAGE_JSON")"
          fi
          
          # محاولة البحث عن أي ملف build.gradle
          GRADLE_FILE=$(find . -name "*gradle*" -type f | head -n 1)
          if [ -n "$GRADLE_FILE" ]; then
            echo "تم العثور على ملفات أندرويد في: $(dirname "$GRADLE_FILE")"
          fi
    artifacts:
      - "**/*.apk"
