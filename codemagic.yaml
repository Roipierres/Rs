workflows:
  android-build:
    name: Android Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    scripts:
      - name: Build Android APK
        script: |
          chmod +x gradlew || true
          ./gradlew assembleRelease || ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
