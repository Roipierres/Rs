workflows:
  android-build:
    name: Build Native Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    scripts:
      - name: Upgrade Gradle and Build APK
        script: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          # إيقاف التتبع الطويل وإظهار رسالة الخطأ المباشرة فقط
          ./gradlew assembleDebug -x test -x lint --warning-mode none
    artifacts:
      - app/build/outputs/apk/**/*.apk
